[project]
name = "import-service"
version = "1.0.0"
description = "Parses bank CSV exports and dispatches transactions to a RabbitMQ queue for import."
requires-python = ">=3.12"
dependencies = [
    "aio-pika==9.6.2",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.50.0",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "httpx==0.28.1",
    "ruff==0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
